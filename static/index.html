<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirana Khata – Voice Ledger</title>
<style>
  :root{--bg:#fffaf0;--card:#ffffff;--ink:#2b2118;--muted:#7a6a58;--brand:#d9480f;--ok:#2b8a3e;--line:#eadfce}
  @media (prefers-color-scheme: dark){:root{--bg:#1c1713;--card:#2a231c;--ink:#f6efe6;--muted:#b9a995;--brand:#ff8a4c;--ok:#69db7c;--line:#43382d}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  h1{margin:0;font-size:1.5rem} .sub{color:var(--muted);font-size:.9rem}
  main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 24px 24px;max-width:1100px;margin:auto}
  @media(max-width:800px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .total{font-size:2.4rem;font-weight:700;color:var(--brand)}
  table{width:100%;border-collapse:collapse} td,th{padding:8px 4px;text-align:left;border-bottom:1px solid var(--line)}
  td.r,th.r{text-align:right} .due{color:var(--brand);font-weight:600} .clear{color:var(--ok)}
  .row{display:flex;gap:8px} input{flex:1;padding:12px;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
  button{padding:12px 16px;font-size:1rem;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
  button.mic{background:var(--ok)} button.chip{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:6px 10px;font-size:.85rem;margin:4px 4px 0 0}
  .reply{margin-top:12px;padding:12px;border-radius:10px;background:var(--bg);min-height:48px}
  .draft{margin-top:8px;white-space:pre-wrap;font-size:.95rem} a{color:var(--brand)}
  .full{grid-column:1/-1} .small{font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div><h1>🧾 Kirana Khata</h1><div class="sub" id="shop">Voice ledger for kirana shops · Alexa+ MCP demo</div></div>
  <div class="sub">MCP endpoint: <code>/mcp</code></div>
</header>
<main>
  <section class="card">
    <div class="sub">Kul udhaar baaki</div>
    <div class="total" id="total">₹0</div>
    <table id="cust"><thead><tr><th>Customer</th><th class="r">Baaki</th></tr></thead><tbody></tbody></table>
  </section>

  <section class="card">
    <strong>🎙️ Alexa+ simulator</strong>
    <div class="small">Mic dabao (Chrome) ya type karo. Hinglish chalta hai.</div>
    <div class="row" style="margin-top:10px">
      <input id="cmd" placeholder="Ramesh ke naam 200 ka udhaar likho" autocomplete="off">
      <button id="send">Bhejo</button>
      <button id="mic" class="mic" title="Bolo">🎤</button>
    </div>
    <div id="chips"></div>
    <div class="reply" id="reply">Jawab yahan dikhega…</div>
    <div class="draft" id="draft"></div>
  </section>

  <section class="card full">
    <strong>Recent hisaab</strong>
    <table id="recent"><thead><tr><th>Naam</th><th>Kya hua</th><th class="r">Amount</th><th class="r">Time</th></tr></thead><tbody></tbody></table>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const examples = ["Ramesh ke naam 200 ka udhaar likho","Sharma ji ne 500 diye","Aaj kitna udhaar baaki hai?",
  "Sabse zyada paisa kis se lena hai?","Pappu ko reminder bhejo","Chhota bhaiya ne 100 diye","Ramesh ko Bade Bhaiya bhi bolte hain"];
examples.forEach(e => { const b=document.createElement('button'); b.className='chip'; b.textContent=e;
  b.onclick=()=>{$('cmd').value=e; send();}; $('chips').appendChild(b); });

async function refresh(){
  const d = await (await fetch('/api/snapshot')).json();
  $('shop').textContent = d.shop + ' · Alexa+ MCP demo';
  $('total').textContent = '₹' + d.total_baaki;
  $('cust').tBodies[0].innerHTML = d.customers.map(c =>
    `<tr><td>${c.name}${c.aliases&&c.aliases.length?` <span class="small">(${c.aliases.join(', ')})</span>`:''}</td><td class="r ${c.balance>0?'due':'clear'}">${c.balance>0?'₹'+c.balance:'clear ✓'}</td></tr>`).join('');
  $('recent').tBodies[0].innerHTML = d.recent.map(r =>
    `<tr><td>${r.name}</td><td>${r.kind==='udhaar'?'Udhaar likha':'Paise mile'}</td><td class="r">₹${r.amount}</td><td class="r small">${r.created_at}</td></tr>`).join('');
}
function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='hi-IN'; speechSynthesis.speak(u);}catch(e){} }
async function send(){
  const text = $('cmd').value.trim(); if(!text) return;
  const res = await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  const d = await res.json();
  $('reply').textContent = (d.ok===false?'⚠️ ':'✅ ') + d.message;
  $('draft').innerHTML = d.draft ? d.draft.replace(/</g,'&lt;') + (d.whatsapp_link?`<br><a target="_blank" rel="noopener" href="${d.whatsapp_link}">WhatsApp pe bhejo →</a>`:'') : '';
  speak(d.message); $('cmd').value=''; refresh();
}
$('send').onclick = send;
$('cmd').addEventListener('keydown', e => { if(e.key==='Enter') send(); });
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR){ $('mic').style.display='none'; } else {
  $('mic').onclick = () => { const r=new SR(); r.lang='hi-IN'; r.onresult=e=>{$('cmd').value=e.results[0][0].transcript; send();}; r.start(); };
}
refresh();
</script>
</body>
</html>
